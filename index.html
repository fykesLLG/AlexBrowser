<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlexBrowser</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Верхняя инфо-панель -->
    <div class="system-bar">
        <span id="browser-mode">🌐 AlexBrowser v1.0</span>
        <span id="live-time">00:00:00</span>
    </div>

    <!-- Панель закладок, управляемая базой телефона -->
    <div class="control-panel">
        <div class="bookmarks-bar" id="bookmarksContainer"></div>
    </div>

    <!-- Главный экран -->
    <div class="search-zone" id="mainZone">
        <div class="logo">AlexBrowser</div>
        
        <div class="search-container">
            <!-- 100% РАБОЧАЯ ФОРМА ВНУТРЕННЕГО ПОИСКА -->
            <form method="get" action="https://bing.com" target="appViewport" onsubmit="handleSearchSubmit()">
                <input type="text" name="q" id="searchField" class="neon-input" placeholder="Поиск в интернете..." required>
                <br>
                <button type="submit" class="neon-btn">НАЙТИ</button>
            </form>
        </div>

        <!-- Быстрые плитки -->
        <div class="results-grid">
            <div class="grid-card">
                <h3>Госуслуги</h3>
                <button class="neon-btn" onclick="openWebSite('https://gosuslugi.ru')">Открыть</button>
            </div>
            <div class="grid-card">
                <h3>ВКонтакте</h3>
                <button class="neon-btn" onclick="openWebSite('https://vk.com')">Открыть</button>
            </div>
        </div>
    </div>

    <!-- Кнопка «Назад на главную», которая появится при просмотре сайтов -->
    <button id="backHomeBtn" class="neon-btn back-btn" onclick="goHome()">🏠 НА ГЛАВНУЮ</button>

    <!-- Внутреннее окно для отображения сайтов без вылета из приложения -->
    <iframe id="appViewport" name="appViewport" class="view-frame"></iframe>

    <script src="script.js"></script>
</body>
</html>
